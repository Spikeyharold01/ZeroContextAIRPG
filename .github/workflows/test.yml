name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: erp-dm-server/requirements-dev.txt
      - name: Install development requirements
        run: python -m pip install -r erp-dm-server/requirements-dev.txt
      - name: Verify json-repair installation
        run: python -c "import importlib.metadata as m; print(m.version('json-repair'))"
      - name: Run acceptance checks
        run: ./scripts/check.sh
